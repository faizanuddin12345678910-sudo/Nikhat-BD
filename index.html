<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4 font-sans select-none overflow-hidden">

    <!-- Top Info / Controls Bar -->
    <div class="max-w-md w-full flex justify-between items-center mb-3 px-2 text-xs sm:text-sm text-slate-400">
        <div>Target Score: <span id="targetScoreDisplay" class="text-amber-400 font-bold">30</span></div>
        <button id="settingsBtn" class="hover:text-white underline transition">⚙️ Settings &amp; Picture</button>
    </div>

    <!-- Game & Canvas Container -->
    <div class="relative w-full max-w-md aspect-[4/5] bg-sky-300 rounded-2xl shadow-2xl overflow-hidden border-4 border-slate-700">
        
        <!-- Main Game Canvas -->
        <canvas id="gameCanvas" class="w-full h-full block" width="366" height="460"></canvas>

        <!-- Overlay: Start Screen -->
        <div id="startOverlay" class="absolute inset-0 bg-black/40 backdrop-blur-xs flex flex-col items-center justify-center p-6 text-center hidden">
            <h1 class="text-2xl sm:text-3xl font-pixel text-amber-400 drop-shadow-[0_4px_0_#000] mb-4">FLAPPY REVEAL</h1>
            <p class="text-sm sm:text-base text-slate-100 mb-6 max-w-xs drop-shadow">
                Score <span id="targetText" class="font-bold text-amber-300">30</span> points to unlock the hidden picture!
            </p>
            <button id="startBtn" class="bg-amber-400 hover:bg-amber-300 text-slate-950 font-pixel text-sm px-6 py-4 rounded-xl shadow-lg transform active:translate-y-1 transition font-bold">
                PRESS TO PLAY
            </button>
            <p class="mt-6 text-xs text-slate-300">Tap / Click / Spacebar to Fly</p>
        </div>

        <div id="gameOverOverlay" class="absolute inset-0 bg-black/60 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center">
            <h2 class="text-2xl font-pixel text-red-500 mb-2 drop-shadow-[0_2px_0_#000]">GAME OVER</h2>

    <div id="settingsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-30 hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                <span>⚙️</span> Game Settings &amp; Picture

            <div class="space-y-4 text-sm">
                <!-- Image Input -->
                <div>

            </div>

        let targetScore = 30;
        let imageFitMode = "object-contain";

        let gameState = 'START';
        let score = 0;
        let animationFrameId = null;

        function showToast(msg = "Saved successfully!") {
            toast.textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        function applyPictureToUI() {
            if (ACTIVE_PICTURE_SOURCE) {
                revealImage.src = ACTIVE_PICTURE_SOURCE;
            }
            targetScoreDisplay.textContent = targetScore;
            targetText.textContent = targetScore;
            revealImage.className = `w-full h-full ${imageFitMode} rounded-lg transition-all duration-300`;
        }

        // Canvas Sizing
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resizeCanvas);

        // Flappy Bird Physics (Ultra-Easy Mode)
        const bird = {
            x: 60,
            y: 200,
            radius: 12,
            velocity: 0,
            gravity: 0.12,
            jump: -3.2,
            rotation: 0
        };

        let pipes = [];
        const pipeWidth = 48;
        const pipeGap = 210;
        let pipeTimer = 0;
        const pipeSpawnInterval = 200;
        const pipeSpeed = 0.8;

        function initGame() {
            bird.y = canvas.height / 2;
            bird.velocity = 0;
            bird.rotation = 0;
            pipes = [];
            score = 0;
            pipeTimer = 0;
            applyPictureToUI();
        }

        function flap() {
            if (gameState === 'PLAYING') {
                bird.velocity = bird.jump;
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (gameState === 'PLAYING') flap();
                else if (gameState === 'START' || gameState === 'GAMEOVER') startGame();
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gameState === 'PLAYING') flap();
        });

        canvas.addEventListener('mousedown', () => {
            if (gameState === 'PLAYING') flap();
        });

        function spawnPipe() {
            const minHeight = 50;
            const maxHeight = canvas.height - pipeGap - minHeight - 40;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            pipes.push({
                x: canvas.width,
                topHeight: topHeight,
                bottomY: topHeight + pipeGap,
                passed: false
            });
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            bird.velocity += bird.gravity;
            bird.y += bird.velocity;
            bird.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 8, bird.velocity * 0.08));

            const groundY = canvas.height - 30;
            if (bird.y + bird.radius >= groundY || bird.y - bird.radius <= 0) {
                triggerGameOver();
                return;
            }

            pipeTimer++;
            if (pipeTimer >= pipeSpawnInterval) {
                spawnPipe();
                pipeTimer = 0;
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                const p = pipes[i];
                p.x -= pipeSpeed;

                if (!p.passed && p.x + pipeWidth < bird.x) {
                    p.passed = true;
                    score++;

                    if (score >= targetScore) {
                        triggerVictory();
                        return;
                    }
                }

                const inPipeX = (bird.x + bird.radius > p.x) && (bird.x - bird.radius < p.x + pipeWidth);
                const hitTopPipe = bird.y - bird.radius < p.topHeight;
                const hitBottomPipe = bird.y + bird.radius > p.bottomY;

                if (inPipeX && (hitTopPipe || hitBottomPipe)) {
                    triggerGameOver();
                    return;
                }

                if (p.x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#70c5ce';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            pipes.forEach(p => {
                const pipeGrad = ctx.createLinearGradient(p.x, 0, p.x + pipeWidth, 0);
                pipeGrad.addColorStop(0, '#73bf2e');
                pipeGrad.addColorStop(0.5, '#9ece38');
                pipeGrad.addColorStop(1, '#53a018');

                ctx.fillStyle = pipeGrad;
                ctx.strokeStyle = '#2d5a0b';
                ctx.lineWidth = 2;

                ctx.fillRect(p.x, 0, pipeWidth, p.topHeight);
                ctx.strokeRect(p.x, 0, pipeWidth, p.topHeight);
                ctx.fillRect(p.x - 3, p.topHeight - 16, pipeWidth + 6, 16);
                ctx.strokeRect(p.x - 3, p.topHeight - 16, pipeWidth + 6, 16);

                const bottomHeight = canvas.height - p.bottomY;
                ctx.fillRect(p.x, p.bottomY, pipeWidth, bottomHeight);
                ctx.strokeRect(p.x, p.bottomY, pipeWidth, bottomHeight);
                ctx.fillRect(p.x - 3, p.bottomY, pipeWidth + 6, 16);
                ctx.strokeRect(p.x - 3, p.bottomY, pipeWidth + 6, 16);
            });

            const groundHeight = 30;
            ctx.fillStyle = '#ded895';
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
            ctx.fillStyle = '#73bf2e';
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, 6);

            ctx.save();
            ctx.translate(bird.x, bird.y);
            ctx.rotate(bird.rotation);

            ctx.beginPath();
            ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#facc15';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ca8a04';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(5, -4, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(6, -4, 2, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            ctx.beginPath();
            ctx.fillStyle = '#f97316';
            ctx.fillRect(6, 0, 10, 6);
            ctx.strokeRect(6, 0, 10, 6);

            ctx.beginPath();
            ctx.ellipse(-5, 2, 7, 4, Math.PI / 6, 0, Math.PI * 2);
            ctx.fillStyle = '#eab308';
            ctx.fill();
            ctx.stroke();

            ctx.restore();

            if (gameState === 'PLAYING') {
                ctx.font = '24px "Press Start 2P", sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 4;
                ctx.textAlign = 'center';
                ctx.strokeText(score, canvas.width / 2, 50);
                ctx.fillText(score, canvas.width / 2, 50);
            }
        }

        function gameLoop() {
            update();
            draw();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            initGame();
            gameState = 'PLAYING';
            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            victoryOverlay.classList.add('hidden');
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            finalScore.textContent = score;
            neededScore.textContent = targetScore;
            applyPictureToUI();
            gameOverOverlay.classList.remove('hidden');
        }

        function triggerVictory() {
            gameState = 'VICTORY';
            applyPictureToUI();
            victoryOverlay.classList.remove('hidden');
        }

        function openSettings() {
            imageUrlInput.value = ACTIVE_PICTURE_SOURCE.startsWith('data:') ? '' : ACTIVE_PICTURE_SOURCE;
            targetScoreInput.value = targetScore;
            imageFitSelect.value = imageFitMode;
            settingsModal.classList.remove('hidden');
        }

        function closeSettings() {
            settingsModal.classList.add('hidden');
        }

        function saveSettings() {
            const newTarget = parseInt(targetScoreInput.value, 10);
            if (newTarget > 0) targetScore = newTarget;

            imageFitMode = imageFitSelect.value;

            const commitAndClose = (imgSrc) => {
                ACTIVE_PICTURE_SOURCE = imgSrc;
                applyPictureToUI();
                closeSettings();
                showToast("Picture saved permanently!");
                // Direct download trigger without delay
                setTimeout(() => {
                    exportGameFile(false);
                }, 100);
            };

            if (imageFileInput.files && imageFileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const maxDim = 800;
                        let w = img.width;
                        let h = img.height;
                        if (w > maxDim || h > maxDim) {
                            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                            else { w = Math.round((w * maxDim) / h); h = maxDim; }
                        }
                        const cvs = document.createElement('canvas');
                        cvs.width = w;
                        cvs.height = h;
                        const c = cvs.getContext('2d');
                        c.drawImage(img, 0, 0, w, h);
                        commitAndClose(cvs.toDataURL('image/jpeg', 0.85));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(imageFileInput.files[0]);
            } else if (imageUrlInput.value.trim() !== '') {
                commitAndClose(imageUrlInput.value.trim());
            } else {
                applyPictureToUI();
                closeSettings();
                showToast("Settings applied!");
            }
        }

        // Export Standalone Game File with Baked-in Picture
        function exportGameFile(notify = true) {
            let docString = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            docString = docString.replace(
                /let ACTIVE_PICTURE_SOURCE = "[\s\S]*?";/,
                `let ACTIVE_PICTURE_SOURCE = "${ACTIVE_PICTURE_SOURCE.replace(/"/g, '\\"')}";`
            );
            docString = docString.replace(
                /let targetScore = \d+;/,
                `let targetScore = ${targetScore};`
            );
            docString = docString.replace(
                /let imageFitMode = "[\s\S]*?";/,
                `let imageFitMode = "${imageFitMode}";`
            );

            const blob = new Blob([docString], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'FlappyBird_VictoryGame.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            if (notify) showToast("📥 Standalone Game File Downloaded!");
        }

        // Event Listeners
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        replayBtn.addEventListener('click', startGame);
        settingsBtn.addEventListener('click', openSettings);
        changeImageBtn.addEventListener('click', openSettings);
        closeSettingsBtn.addEventListener('click', closeSettings);
        saveSettingsBtn.addEventListener('click', saveSettings);
        downloadFileBtn.addEventListener('click', () => exportGameFile(true));

        revealImage.addEventListener('error', () => {
            revealImage.src = 'https://placehold.co/600x600/ef4444/ffffff?text=Image+Load+Error';
        });

        window.onload = function() {
            resizeCanvas();
            applyPictureToUI();
            gameLoop();
        };
    </script>

</body></html>
